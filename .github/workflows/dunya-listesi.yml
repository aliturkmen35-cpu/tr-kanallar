name: Türkiye ve bölgesel kanallar (iptv-org)

on:
  schedule:
    - cron: "40 */6 * * *"   # 6 saatte bir: yeni adresler ve yedekler
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Türkiye listesini al; tür/bölge grupları, yedek adresler
        run: python tools/import_iptv_org.py --tr --check
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "kanal-botu"
          git config user.email "kanal-botu@users.noreply.github.com"
          git pull --rebase --autostash
          git add world.json channels.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Türkiye kanalları ve yedek adresler güncellendi (iptv-org)"
            git push
          fi
