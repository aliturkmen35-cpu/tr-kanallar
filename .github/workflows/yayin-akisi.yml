name: Yayın akışı (EPG)

on:
  schedule:
    - cron: "15 */6 * * *"   # 6 saatte bir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yayın akışını indir ve kanallarla eşleştir
        run: python tools/build_epg.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "kanal-botu"
          git config user.email "kanal-botu@users.noreply.github.com"
          git pull --rebase
          git add epg.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Yayın akışı güncellendi"
            git push
          fi
